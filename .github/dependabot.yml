version: 2
updates:
  # This repo has no runtime dependencies. What it does have is hook revs and
  # action pins, which are exactly the two things that rot when nothing watches
  # them -- the failure CameronBrooks11/dev-toolbox#72 records, and the reason
  # heibench/slicelab and heibench/prusaslicer-py sat on gitleaks v8.27.2 for
  # months. Both ecosystems are declared from the first commit.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      hooks:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
